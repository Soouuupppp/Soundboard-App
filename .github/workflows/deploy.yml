name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and restart containers
        run: |
          docker compose --env-file /home/soundboard/.env pull || true
          docker compose --env-file /home/soundboard/.env up -d --build
          docker image prune -f
