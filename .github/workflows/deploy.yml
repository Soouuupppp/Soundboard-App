name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # Skip `git clean -ffdx`. The compose stack bind-mounts ./data_db and
          # ./data_public, which are owned by container UIDs the runner can't
          # read — clean would EACCES on every deploy.
          clean: false

      - name: Rebuild and restart containers
        run: |
          docker compose --env-file /home/soundboard/.env pull || true
          docker compose --env-file /home/soundboard/.env up -d --build
          docker image prune -f
