name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and restart containers
        # docker-rebuild.mjs keeps a rolling soundboard-web:latest/:prev pair
        # (prev = one build back, for `pnpm rollback`) and prunes older layers,
        # so rebuilds replace images instead of piling up dangling <none> ones.
        run: |
          docker compose --env-file /home/soundboard/.env pull || true
          node scripts/docker-rebuild.mjs --env-file /home/soundboard/.env --detach
