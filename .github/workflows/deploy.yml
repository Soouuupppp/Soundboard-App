name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Copy .env from VPS
        run: cp ~/soundboard.env .env

      - name: Rebuild and restart containers
        run: |
          docker compose pull || true
          docker compose up -d --build
          docker image prune -f
