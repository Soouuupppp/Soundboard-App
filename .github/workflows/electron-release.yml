name: Electron Release

on:
  push:
    branches: [main]
    paths: [electron/package.json]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./electron/package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT
          if gh release view "electron-v$version" >/dev/null 2>&1; then
            echo "Release electron-v$version already exists — skipping."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter electron...

      - name: Build
        working-directory: electron
        env:
          SOUNDBOARD_URL: ${{ vars.SOUNDBOARD_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist

      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.AppImage

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: electron-v${{ needs.check.outputs.version }}
          name: Soundboard ${{ needs.check.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
