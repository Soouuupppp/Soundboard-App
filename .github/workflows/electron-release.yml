name: Electron Release

# Bump `version` in electron/package.json and push to main. If the corresponding
# `electron-vX.Y.Z` tag doesn't already exist as a published GitHub release,
# this workflow builds the Windows binaries, lets electron-builder publish a
# draft release (with the latest.yml manifest the auto-updater reads), then
# flips that draft to a published "latest" release so installed clients pick it
# up on next launch.

on:
  push:
    branches: [main]
    paths: [electron/package.json]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./electron/package.json').version")
          tag="electron-v$version"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT
          # A published release with this tag means we've already shipped it.
          # Drafts are fine to overwrite (a previous attempt didn't finish).
          if gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null | grep -qx false; then
            echo "Release $tag already published — skipping."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter electron...

      - name: Build & publish draft release
        working-directory: electron
        env:
          SOUNDBOARD_URL: ${{ vars.SOUNDBOARD_URL }}
          # electron-builder reads GH_TOKEN to create/append the draft release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--publish always` makes electron-builder upload the nsis installer,
        # the portable .exe, and `latest.yml` (the manifest the auto-updater
        # polls) to a draft GitHub release tagged from electron/package.json.
        run: pnpm bake && pnpm exec electron-builder --win --publish always

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Flip draft release to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        # `--latest` makes this the release the auto-updater will see at
        # /releases/latest/download/latest.yml.
        run: |
          gh release edit "$TAG" \
            --draft=false \
            --latest \
            --title "Soundboard $VERSION"
