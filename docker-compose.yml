services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # DATA_DB_DIR points at the host directory that holds the postgres data.
      # On prod set it to /home/soundboard/data_db in the env file so the data
      # lives outside the runner workspace (otherwise actions/checkout's clean
      # step EACCESes on the postgres-owned files). Defaults to ./data_db for
      # local dev.
      - ${DATA_DB_DIR:-./data_db}:/var/lib/postgresql/data
    # Bind Postgres to localhost only — there's no reason for the host network
    # to reach the DB. The `web` service still talks to it over the compose
    # network using hostname "db". Drop the `ports:` entry entirely if you
    # don't need host-side psql/admin access.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    # Stable name so rebuilds replace this tag instead of leaving a dangling
    # <none> image behind. The rolling latest/prev tagging (one build back kept
    # for rollback) is handled by scripts/docker-rebuild.mjs — see that file.
    image: soundboard-web:latest
    restart: unless-stopped
    # Cap resources so a malicious media decode (ffmpeg/yt-dlp on imported audio)
    # or a memory-heavy request can't starve the host. Honored by `docker compose up`.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Container listens on this port; must match the right-hand side of the ports mapping below.
      PORT: 5050
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_ADMIN_IDS: ${DISCORD_ADMIN_IDS}
      UPLOADS_DIR: ${UPLOADS_DIR}
      DEFAULT_MAX_FILE_SIZE: ${DEFAULT_MAX_FILE_SIZE}
      DEFAULT_MAX_TOTAL_STORAGE: ${DEFAULT_MAX_TOTAL_STORAGE}
      # ver/1.4.1: default cap on profiles per user (user/role overrides live in the DB).
      DEFAULT_PROFILE_LIMIT: ${DEFAULT_PROFILE_LIMIT:-5}
      # --- ver/1.4.1 Paid AI voice (all optional; the free rvc_zero engine needs none) ---
      # Default monthly AI quota in SECONDS (user/role overrides live in the DB).
      DEFAULT_AI_QUOTA_SECONDS: ${DEFAULT_AI_QUOTA_SECONDS:-300}
      # App-owned provider keys. When set, users spend the shared key against their
      # quota; when unset, only users with their own BYO key can use that provider.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_API_BASE: ${ELEVENLABS_API_BASE:-}
      ELEVENLABS_STS_MODEL: ${ELEVENLABS_STS_MODEL:-}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-}
      RESPEECHER_API_KEY: ${RESPEECHER_API_KEY:-}
      # Respeecher's REST surface is account-specific — set these to its file-STS /
      # TTS endpoints, else Respeecher returns a clear "not configured" error.
      RESPEECHER_STS_URL: ${RESPEECHER_STS_URL:-}
      RESPEECHER_TTS_URL: ${RESPEECHER_TTS_URL:-}
      # Path inside the container where yt-convert looks for YouTube cookies;
      # matches the mount target below. Used only if the file is non-empty.
      YTDLP_COOKIES: ${YTDLP_COOKIES:-/secrets/yt-cookies.txt}
      # Escape hatches for YouTube's datacenter-IP bot checks (both optional):
      # YTDLP_PROXY routes downloads through a proxy (residential = reliable fix);
      # YTDLP_EXTRACTOR_ARGS passes e.g. "youtube:player_client=tv".
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      YTDLP_EXTRACTOR_ARGS: ${YTDLP_EXTRACTOR_ARGS:-}
    volumes:
      # DATA_PUBLIC_DIR — same idea as DATA_DB_DIR above. Set to
      # /home/soundboard/data_public on prod; defaults to ./data_public locally.
      - ${DATA_PUBLIC_DIR:-./data_public}:/data_public
      # YouTube cookies (Netscape cookies.txt) to get past "confirm you're not a
      # bot" on datacenter IPs. Point YTDLP_COOKIES_FILE at your cookies.txt on
      # the host; defaults to an empty placeholder so the bind is always valid.
      # yt-convert ignores it unless it's non-empty, so leaving it unset is fine.
      - ${YTDLP_COOKIES_FILE:-./web/.empty-cookies.txt}:/secrets/yt-cookies.txt:ro
    ports:
      # Bind to localhost only — the public edge is Cloudflare → reverse proxy on
      # this host. Publishing on 0.0.0.0 would expose plaintext HTTP directly,
      # bypassing the proxy's TLS/headers. Use the proxy's source IP in a firewall
      # rule instead if the proxy lives on another host.
      - "127.0.0.1:5050:5050"
