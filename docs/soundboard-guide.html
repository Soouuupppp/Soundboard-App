<!--
  Soundboard UI prototype (docs, not part of the app).

  What it is: a clickable copy of the dashboard running on example data, so the
  guide (and later other UI ideas) can be tuned without rebuilding the app.
  Nothing plays, records, uploads or is saved; a reload resets everything.

  Editing:
    - Guide text, steps and info items: the GUIDES / INFO data below.
    - Example clips, profiles and people: the DEMO data below.
    - Markup uses the app's own Tailwind classes. After adding classes or icons
      (icon names are lucide-react file names, e.g. gamepad-2), run:
          node docs/build-guide.mjs
      It refills the generated CSS / icon / logo blocks from the app's
      tailwind.config.ts, globals.css and lucide-react.

  The only network request is the Play font from Google Fonts (the app's font);
  offline it falls back to the system font.
-->

function saveFocus() {
  var a = document.activeElement;
  if (!a || !a.id) return null;
  var f = { id: a.id };
  try { if (typeof a.selectionStart === 'number') { f.s = a.selectionStart; f.e = a.selectionEnd; } } catch (e) { /* not a text field */ }
  return f;
}
function restoreFocus(f) {
  if (!f) return;
  var el = document.getElementById(f.id);
  if (!el || el === document.activeElement) return;
  el.focus({ preventScroll: true });
  try { if (typeof f.s === 'number') el.setSelectionRange(f.s, f.e); } catch (e) { /* not a text field */ }
}
function render() {
  var f = saveFocus();
  $('#app').innerHTML = header() + banner() + '<main class="max-w-[1800px] mx-auto px-4 py-10"><div class="space-y-8">' + addCard() + aiSection() + librarySection() + '</div></main>' + ctrlModal();
  restoreFocus(f);
  placeFloating();
  renderOverlay();
}

/* Keep header popovers on screen and portal open dropdown menus to <body>, then place them
   under (or above) their trigger, clamped to the viewport — like the app's Popover/Select. */
var EDGE = 12;
function placeFloating() {
  var vw = window.innerWidth;
  document.querySelectorAll('[id^="pop-"]').forEach(function (p) {
    p.style.transform = '';
    var r = p.getBoundingClientRect(), dx = 0;
    if (r.right > vw - EDGE) dx = vw - EDGE - r.right;
    if (r.left + dx < EDGE) dx = EDGE - r.left;
    if (dx) p.style.transform = 'translateX(' + Math.round(dx) + 'px)';
  });
  var host = $('#menus');
  if (!host) { host = document.createElement('div'); host.id = 'menus'; document.body.appendChild(host); }
  host.innerHTML = '';
  document.querySelectorAll('#app [role="listbox"][data-menu-for]').forEach(function (m) { host.appendChild(m); });
  placeMenus();
}
function placeMenus() {
  var vw = window.innerWidth, vh = window.innerHeight;
  document.querySelectorAll('#menus [role="listbox"]').forEach(function (m) {
    var t = document.getElementById(m.dataset.menuFor);
    if (!t) { m.remove(); return; }
    var r = t.getBoundingClientRect(), gap = 4;
    var w = Math.min(Math.max(r.width, 192), vw - EDGE * 2);
    var below = vh - EDGE - r.bottom - gap, above = r.top - EDGE - gap;
    m.style.width = w + 'px';
    m.style.zIndex = '70'; // above the guide's dimmed backdrop (ring 65), under its card (75)
    m.style.maxHeight = '';
    var want = Math.min(m.scrollHeight + 2, 256);
    var up = below < want && above > below;
    var h = Math.max(80, Math.min(want, up ? above : below));
    m.style.maxHeight = h + 'px';
    m.style.left = Math.max(EDGE, Math.min(r.left, vw - EDGE - w)) + 'px';
    m.style.top = (up ? r.top - gap - Math.min(h, m.offsetHeight) : r.bottom + gap) + 'px';
  });
}

/* =====================================================================

function ev(type, data) { return { type: type, data: data || {} }; }
function update(e) { render(); tourCheck(e || null); }

function startPlaying(id, secs) {
  clearTimeout(timers[id]);
  if (!isPlaying(id)) S.playing.push(id);
  timers[id] = setTimeout(function () { S.playing = without(S.playing, id); render(); }, (secs || 2.5) * 1000);
}
function play(id, via) {
  if (!snd(id)) return;
  startPlaying(id, Math.min(snd(id).dur, 3));
  update(ev('play', { id: id, via: via || 'click' }));
}
function pickDemoFile() { S.upload.file = true; S.upload.name = 'Victory scream'; S.upload.sel = null; S.upload.cuts = []; }
function setKey(id, chord) { prof().keys[id] = chord; S.view.capture = null; update(ev('bind_key', { id: id })); toast('Keybind set to ' + chord + '.'); }
function capById(id) { return S.livepad.captures.filter(function (c) { return c.id === id; })[0]; }
function captureLivepad(quiet) {
  var lp = S.livepad;
  if (!lp.armed) { toast('Livepad isn’t armed.'); return; }
  lp.seq += 1;
  var d = new Date(), pad = function (n) { return ('0' + n).slice(-2); };
  var label = '';
  DEMO.livepadSources.forEach(function (g) { g.items.forEach(function (it) { if (it[0] === lp.source) label = it[1]; }); });
  lp.captures.unshift({ id: 'c' + lp.seq, name: label + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()), len: lp.len, saved: false });
  if (!quiet) update(ev('lp_capture'));
}
function runBridge(kind) {
  var p = prof();
  if (kind === 'hotkey') {
    var k = p.board.filter(function (id) { return p.keys[id]; })[0];
    if (k) { play(k, 'global'); toast('Global hotkey ' + p.keys[k] + ' → ' + snd(k).name + ' (while a game had focus).'); } else toast('Set a keybind on a Board clip first.');
  } else if (kind === 'vr') {
    var v = p.board.filter(function (id) { return p.ctrl[id] && p.ctrl[id][S.cp]; })[0];
    if (v) { play(v, 'vr'); toast('Controller bind ' + p.ctrl[v][S.cp] + ' → ' + snd(v).name + '.'); } else toast('Set a controller bind on a Board clip first.');
  } else {
    var first = p.board[0];
    if (first) { play(first, kind); toast((kind === 'deck' ? 'Stream Deck key' : 'Avatar panel key 1') + ' → ' + snd(first).name + '.'); } else toast('This Board is empty.');
  }
}

      '<div class="flex items-center gap-1.5 font-medium text-white">' + (TOUR.done ? ic('circle-check', 16, 'text-emerald-400') : '') + h(st.title) + '</div>' +
      '<p class="mt-0.5 text-muted">' + h(st.text) + '</p>' +
      (hidden ? '<p class="mt-1 text-xs text-amber-300">This control isn’t shown at this screen size.</p>' : '') +
      '<div class="mt-2 flex items-center justify-between gap-2"><div class="flex items-center gap-1">' + dots + '</div>' +
        (TOUR.done ? '' : '<button type="button" data-act="tour-skip" class="text-[11px] text-muted hover:text-white">Skip step</button>') + '</div>' +
    '</div>';
}
function renderOverlay() {
  var o = $('#overlay');
  if (HUB.open) o.innerHTML = hubHtml();
  else if (TOUR.on) o.innerHTML = tourHtml();
  else o.innerHTML = '';
  positionTour();
}
function positionTour() {
  if (!TOUR.on) return;
  var ring = $('#tour-ring'), card = $('#tour-card');
  if (!card) return;
  var t = tourTarget();
  var vw = window.innerWidth, vh = window.innerHeight, gap = 16, m = 12;
  var cw = card.offsetWidth, ch = card.offsetHeight;
  if (!t) {
    if (ring) ring.hidden = true;
    card.style.left = Math.max(m, (vw - cw) / 2) + 'px';
    card.style.top = (vh - ch - 24) + 'px';
    return;
  }
  var r = t.getBoundingClientRect(), pad = 6;
  ring.hidden = false;
  ring.style.left = (r.left - pad) + 'px'; ring.style.top = (r.top - pad) + 'px';
  ring.style.width = (r.width + pad * 2) + 'px'; ring.style.height = (r.height + pad * 2) + 'px';
  var p = placeCard(r, pad, cw, ch, vw, vh, gap, m, t);
  card.style.left = p.x + 'px';
  card.style.top = p.y + 'px';
}
// Where the card may go. "Hard" = the target, its open menu and anything it opens below
// (never covered). "Soft" adds the popover the target sits in (covered only if nothing else fits).
function rectOf(el) { var r = el.getBoundingClientRect(); return { l: r.left, t: r.top, r: r.right, b: r.bottom }; }
function grow(a, b) { return b ? { l: Math.min(a.l, b.l), t: Math.min(a.t, b.t), r: Math.max(a.r, b.r), b: Math.max(a.b, b.b) } : a; }
function hits(c, a, g) { return c.l < a.r + g && c.r > a.l - g && c.t < a.b + g && c.b > a.t - g; }
function placeCard(tr, pad, cw, ch, vw, vh, gap, m, t) {
  var hard = { l: tr.left - pad, t: tr.top - pad, r: tr.right + pad, b: tr.bottom + pad };
  document.querySelectorAll('#menus [role="listbox"]').forEach(function (el) { hard = grow(hard, rectOf(el)); });
  var pop = t.closest('[id^="pop-"]');
  if (!pop && t.id && t.id.indexOf('btn-') === 0) pop = document.getElementById('pop-' + t.id.slice(4));
  var soft = pop && pop.getClientRects().length ? grow(hard, rectOf(pop)) : hard;
  var cx = (tr.left + tr.right) / 2 - cw / 2, cy = (tr.top + tr.bottom) / 2 - ch / 2;
  function clamp(x, y) { x = Math.max(m, Math.min(x, vw - cw - m)); y = Math.max(m, Math.min(y, vh - ch - m)); return { x: x, y: y, l: x, t: y, r: x + cw, b: y + ch }; }
  function around(a) {
    return [clamp(cx, a.b + gap), clamp(cx, a.t - gap - ch), clamp(a.r + gap, cy), clamp(a.l - gap - cw, cy)];
  }
  var boxes = soft === hard ? [hard] : [soft, hard];
  for (var i = 0; i < boxes.length; i++) {
    var c = around(boxes[i]);
    for (var j = 0; j < c.length; j++) if (!hits(c[j], boxes[i], gap - 1) && !hits(c[j], hard, gap - 1)) return c[j];
  }
  // Nothing fits beside it: dock to the screen edge farther from the target.
  var bottom = clamp((vw - cw) / 2, vh), top = clamp((vw - cw) / 2, 0);
  var order = (tr.top + tr.bottom) / 2 < vh / 2 ? [bottom, top] : [top, bottom];
  return !hits(order[0], hard, 0) ? order[0] : !hits(order[1], hard, 0) ? order[1] : order[0];
}

render();
</script>
